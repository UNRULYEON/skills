name: External skills sync

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute a run-unique PR body path
        id: pr-body
        run: echo "path=${RUNNER_TEMP}/external-skills-pr-body-${{ github.run_id }}.md" >> "$GITHUB_OUTPUT"

      - name: Check for upstream updates and bump pins
        run: bun scripts/external-skills.ts bump-pins --write --summary "${{ steps.pr-body.outputs.path }}"

      - name: Re-vendor skills at their (possibly bumped) pins
        run: bun scripts/external-skills.ts sync --all --write

      # Fixed branch name (no branch-suffix) means a still-open PR from a
      # previous run gets overwritten with this run's diff instead of a new
      # PR being opened alongside it.
      - name: Open or update the pull request with this run's changes
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "chore: sync external skills"
          title: "chore: sync external skills"
          body-path: ${{ steps.pr-body.outputs.path }}
          branch: chore/external-skills-sync
          delete-branch: true
