name: Risk gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

defaults:
  run:
    shell: bash

env:
  APPROVAL_CONTEXT: risk-gate/approval

jobs:
  approval:
    name: approval
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write
      pull-requests: write
      statuses: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_AT: ${{ github.event.pull_request.updated_at }}
      APPROVER: ${{ github.event.sender.login }}

    steps:
      - name: Record the approval on the approved commit
        if: github.event.action == 'labeled' && github.event.label.name == 'approved'
        run: |
          gh api "repos/$GH_REPO/statuses/$EVENT_HEAD_SHA" \
            -f state=success -f context="$APPROVAL_CONTEXT" -f description="Approved by $APPROVER" > /dev/null

      - name: Revoke an approval older than the change
        if: >-
          github.event.action == 'synchronize' ||
          (github.event.action == 'edited' && (github.event.changes.body != null || github.event.changes.base != null)) ||
          (github.event.action == 'unlabeled' && github.event.label.name == 'approved')
        run: |
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          for sha in $(printf '%s\n%s\n' "$EVENT_HEAD_SHA" "$head_sha" | sort -u); do
            status=$(gh api "repos/$GH_REPO/commits/$sha/status" \
              --jq ".statuses[] | select(.context == \"$APPROVAL_CONTEXT\") | \"\(.state) \(.updated_at)\"" | head -1)
            if [ "${status%% *}" = "success" ] && [[ ! "${status#* }" > "$EVENT_AT" ]]; then
              gh api "repos/$GH_REPO/statuses/$sha" \
                -f state=failure -f context="$APPROVAL_CONTEXT" -f description="Changed after the approval" > /dev/null
            fi
          done
          approved_at=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "approved") | .created_at' | sort | tail -1)
          has_label=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | index("approved") != null')
          if [ "$has_label" = "true" ] && [[ ! "$approved_at" > "$EVENT_AT" ]]; then
            gh pr edit "$PR_NUMBER" --remove-label approved > /dev/null
          fi

  risk-gate:
    name: risk-gate
    needs: approval
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: read

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Fail when the approval job did not finish
        if: needs.approval.result != 'success' && needs.approval.result != 'skipped'
        run: |
          echo "::error::The approval job failed, so the gate cannot trust the approval."
          exit 1

      - name: Pass in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "The pull request passed the gate before it joined the queue."

      - name: Check out the rules from the default branch
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Bun
        if: github.event_name == 'pull_request_target'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Decide the tier
        id: tier
        if: github.event_name == 'pull_request_target'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f .github/scripts/risk-tier.ts ]; then
            echo "The default branch has no risk rules yet. The change is tier 2." | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'tier=2\nmerge-danger-complete=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changes="$RUNNER_TEMP/changes.tsv"
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq 'def safe: if test("[\\x00-\\x1f\\x7f]") then ".github/control-character-in-file-name" else . end;
              .[] | "\(.filename | safe)\t\(.additions + .deletions)", (select(.previous_filename) | "\(.previous_filename | safe)\t0\told")' \
            > "$changes"
          listed=$(grep -cv $'\told$' "$changes" || true)
          expected=$(gh pr view "$PR_NUMBER" --json changedFiles --jq '.changedFiles')
          if [ "$listed" != "$expected" ]; then
            echo "GitHub listed $listed of $expected changed files." | tee -a "$GITHUB_STEP_SUMMARY"
            printf '.github/file-list-cut-off\t0\n' >> "$changes"
          fi
          bun .github/scripts/risk-tier.ts .github/risk-tiers.json < "$changes" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set the risk label
        if: github.event_name == 'pull_request_target'
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          case "$TIER" in
            0|1|2) ;;
            *) echo "::error::The tier is not known: '$TIER'."; exit 1 ;;
          esac
          gh label create "risk:$TIER" --force > /dev/null
          for tier in 0 1 2; do
            if [ "$tier" != "$TIER" ]; then
              gh pr edit "$PR_NUMBER" --remove-label "risk:$tier" > /dev/null 2>&1 || true
            fi
          done
          gh pr edit "$PR_NUMBER" --add-label "risk:$TIER"

      - name: Turn on auto-merge for tier 0
        if: github.event_name == 'pull_request_target' && steps.tier.outputs.tier == '0' && !github.event.pull_request.draft
        env:
          FROM_THIS_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$FROM_THIS_REPOSITORY" != "true" ]; then
            echo "::warning::The pull request comes from a fork. A person must merge it."
            exit 0
          fi
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::warning::MERGE_TOKEN is not set. Auto-merge is off, because a merge with the default token does not deploy to staging."
            exit 0
          fi
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"

      - name: Turn off auto-merge above tier 0
        if: github.event_name == 'pull_request_target' && steps.tier.outputs.tier != '0'
        run: GH_TOKEN="${MERGE_TOKEN:-$GH_TOKEN}" gh pr merge "$PR_NUMBER" --disable-auto --repo "$GITHUB_REPOSITORY" || true

      - name: Check the approval and Merge Danger
        if: github.event_name == 'pull_request_target' && steps.tier.outputs.tier != '0'
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          MERGE_DANGER_COMPLETE: ${{ steps.tier.outputs.merge-danger-complete }}
        run: |
          errors=0
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          has_label=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | index("approved") != null')
          approval=$(gh api "repos/$GH_REPO/commits/$head_sha/status" \
            --jq ".statuses[] | select(.context == \"$APPROVAL_CONTEXT\") | .state" | head -1)
          if [ "$has_label" != "true" ]; then
            echo "::error::This is a tier $TIER change. A person must add the approved label."
            errors=1
          elif [ "$approval" != "success" ]; then
            echo "::error::The approval is not for commit $head_sha. A person must remove the approved label and add it again."
            errors=1
          fi
          if [ "$TIER" = "2" ] && [ "$MERGE_DANGER_COMPLETE" != "true" ]; then
            echo "::error::A tier 2 change must fill in Door and Blast Radius under Merge Danger."
            errors=1
          fi
          exit "$errors"
